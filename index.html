<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyExpenses - مصاريفي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f3;--card:#fff;--ink:#17231f;--mute:#6b7872;--line:#e3e7e2;--ac:#0e5a4a;--acb:#e4f0ec;--danger:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101614;--card:#18211e;--ink:#e8eeeb;--mute:#8d9b95;--line:#27332f;--ac:#5fc2a8;--acb:#1d2e29;--danger:#f2b8b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101614;--card:#18211e;--ink:#e8eeeb;--mute:#8d9b95;--line:#27332f;--ac:#5fc2a8;--acb:#1d2e29;--danger:#f2b8b5;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:8px 0 16px;font-weight:600}h2{font-size:15px;margin:22px 0 10px;color:var(--mute);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.big{font-size:34px;font-weight:600;line-height:1.3}.mute{color:var(--mute);font-size:13px}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.item{cursor:pointer}.item b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;background:var(--ac);color:var(--bg);border-radius:10px;padding:11px 16px;font-weight:500;cursor:pointer}
.btn.sec{background:var(--acb);color:var(--ac)}.btn.dng{background:var(--danger);color:#fff}
.btn.full{width:100%}.btns{display:flex;gap:8px;margin-top:14px}
.bar{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;max-width:140px;background:none;border:0;padding:10px 0 9px;color:var(--mute);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac);font-weight:600}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:10px;border:2px solid transparent;cursor:pointer;background:var(--card);font-size:18px}.sw button.on{border-color:var(--ac)}
.empty{text-align:center;color:var(--mute);padding:36px 10px}.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px}
.back{background:none;border:0;color:var(--ac);padding:0;cursor:pointer;margin-bottom:4px}.pin{color:var(--ac)}
</style>
</head>
<body>
<main id="app"></main>
<button class="btn fab" data-act="addExp">+ مصروف سريع</button>
<nav>
<button data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>الرئيسية</button>
<button data-nav="lists"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>قوائمي</button>
<button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>الإعدادات</button>
</nav>
<script>
const CUR={IQD:{d:0,s:'د.ع'},USD:{d:2,s:'$'},EUR:{d:2,s:'€'}};
const COLORS=['#0e5a4a','#2f6fb5','#b5532f','#8a4fb0','#b08a1f','#c2375b'];
const ICONS=['🏠','🚗','✈️','🛒','💼','📚','💍','🧾'];
const CATS=['طعام','مواصلات','مواد','أدوات','أجور','فواتير','أخرى'];
const $=s=>document.querySelector(s);
let S={lists:[],expenses:[],settings:{theme:'auto',cur:'IQD'}};
let V={tab:'home',list:null,q:'',sort:'upd',eq:'',esort:'date',arch:false,sheet:null};
let KEY='myexp_v1';function loadS(){S={lists:[],expenses:[],settings:{theme:'auto',cur:'IQD'}};try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}applyTheme()}
let SYNC={on:false,ready:false,m:{},un:[],pend:{},cache:{},srv:{},leg:{lists:[],expenses:[]}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(SYNC.on?{settings:S.settings,lists:SYNC.leg.lists,expenses:SYNC.leg.expenses}:S))}catch(e){}if(SYNC.on)syncPush()};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,،]/g,'.').replace(/\s/g,'');
const now=()=>Date.now();
const today=()=>{const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)};
const fd=i=>{const[y,m,d]=i.split('-');return d+'/'+m+'/'+y};
function toMinor(str,c){str=norm(str);if(!/^\d*\.?\d*$/.test(str)||str===''||str==='.')return null;let[i,f='']=str.split('.');const d=CUR[c].d;f=(f+'0'.repeat(d)).slice(0,d);return Number((i||'0')+f)}
function fmt(m,c){const d=CUR[c].d,p=10**d;let s=Math.floor(m/p).toLocaleString('en-US');if(d)s+='.'+String(m%p).padStart(d,'0');return s+' '+CUR[c].s}
function toInput(m,c){const d=CUR[c].d,p=10**d;return d?Math.floor(m/p)+'.'+String(m%p).padStart(d,'0'):String(m)}
function totals(a){const t={};a.forEach(x=>t[x.cur]=(t[x.cur]||0)+x.amt);return t}
const totHTML=(t,big)=>{const k=Object.keys(t);if(!k.length)return `<span class="mute">لا توجد مصروفات</span>`;return k.map(c=>`<div class="${big?'big':''}"><span class="num">${fmt(t[c],c)}</span></div>`).join('')};
const listExp=id=>S.expenses.filter(e=>e.list===id);
const getList=id=>S.lists.find(l=>l.id===id);
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)};

function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

function listCard(l){const ex=listExp(l.id);return `<div class="card item row" data-act="open" data-id="${l.id}"><div class="ico" style="background:${l.color}22">${l.icon}</div><div class="grow"><b>${l.pin?'<span class="pin">● </span>':''}${esc(l.name)}</b><div class="mute"><span class="num">${ex.length}</span> مصروف · بدأت <span class="num">${fd(l.start)}</span></div></div><div style="text-align:end">${totHTML(totals(ex))}</div></div>`}
function expRow(e,showList){const l=getList(e.list);return `<div class="card item row" data-act="expMenu" data-id="${e.id}"><div class="grow"><b>${esc(e.name)}</b><div class="mute"><span class="num">${fd(e.date)}</span>${e.time?' <span class="num">'+e.time+'</span>':''}${e.cat?' · '+esc(e.cat):''}${showList&&l?' · '+esc(l.name):''}</div></div><div><span class="num">${fmt(e.amt,e.cur)}</span></div></div>`}

function render(){
const a=$('#app');let h='';
const gate=FB_READY&&(!USER||!MK||!!V.rk);document.querySelector('nav').style.display=document.querySelector('.fab').style.display=gate?'none':'';
if(FB_READY&&!AUTHREADY){a.innerHTML='<div class="empty">'+(FBERR?esc(FBERR):'جاري التحميل…')+'</div>';return}
if(gate){a.innerHTML=!USER?authView():cryptoView();return}
if(FB_READY&&USER&&MK&&!SYNC.on)startSync();
if(SYNC.on&&!SYNC.ready){a.innerHTML='<div class="empty">جاري المزامنة…</div>';return}
const active=S.lists.filter(l=>!l.arch);
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===V.tab&&!V.list));
if(V.list){const l=getList(V.list);if(!l){V.list=null;return render()}
let ex=listExp(l.id);const q=V.eq.trim().toLowerCase();if(q)ex=ex.filter(e=>(e.name+' '+(e.desc||'')+' '+(e.cat||'')).toLowerCase().includes(q));
ex.sort(V.esort==='amt'?(x,y)=>y.amt-x.amt:(x,y)=>(y.date+(y.time||'')).localeCompare(x.date+(x.time||'')));
h=`<button class="back" data-act="back">‹ قوائمي</button><div class="row"><div class="ico" style="background:${l.color}22">${l.icon}</div><div class="grow"><h1 style="margin:0">${esc(l.name)}</h1></div><button class="btn sec" data-act="exp">تصدير</button><button class="btn sec" data-act="listMenu">خيارات</button></div>${l.desc?`<p class="mute">${esc(l.desc)}</p>`:''}
<div class="card" style="margin-top:12px"><div class="mute">المجموع · <span class="num">${listExp(l.id).length}</span> مصروف${l.end?' · حتى <span class="num">'+fd(l.end)+'</span>':''}</div>${totHTML(totals(listExp(l.id)),1)}</div>
<div class="bar"><input id="eq" placeholder="بحث في المصروفات" value="${esc(V.eq)}"><select id="esort" style="width:auto"><option value="date">الأحدث</option><option value="amt" ${V.esort==='amt'?'selected':''}>الأكبر مبلغًا</option></select></div>
${ex.length?ex.map(e=>expRow(e)).join(''):`<div class="empty">${V.eq?'لا توجد نتائج':'لم تُسجَّل مصروفات بعد. اضغط «مصروف سريع» لإضافة أول مصروف.'}</div>`}`}
else if(V.tab==='home'){const all=S.expenses.filter(e=>{const l=getList(e.list);return l&&!l.arch});const rec=[...all].sort((x,y)=>(y.date+(y.time||'')).localeCompare(x.date+(x.time||''))).slice(0,5);
h=`<h1>مصاريفي</h1>${verifyBanner()}<div class="card"><div class="mute">مجموع كل القوائم النشطة (لكل عملة على حدة)</div>${totHTML(totals(all),1)}</div>
${S.lists.length?'':`<div class="empty">ابدأ بإنشاء قائمة لتسجيل مصروفاتك.<br><br><button class="btn" data-act="addList">إنشاء قائمة</button></div>`}
${active.some(l=>l.pin)?'<h2>القوائم المثبتة</h2>'+active.filter(l=>l.pin).map(listCard).join(''):''}
${rec.length?'<h2>آخر المصروفات</h2>'+rec.map(e=>expRow(e,1)).join(''):''}`}
else if(V.tab==='lists'){let ls=S.lists.filter(l=>!!l.arch===V.arch);const q=V.q.trim().toLowerCase();if(q)ls=ls.filter(l=>l.name.toLowerCase().includes(q));
const tt=l=>Object.values(totals(listExp(l.id))).reduce((a,b)=>a+b,0);
ls.sort((x,y)=>(y.pin?1:0)-(x.pin?1:0)||(V.sort==='name'?x.name.localeCompare(y.name,'ar'):V.sort==='total'?tt(y)-tt(x):V.sort==='start'?y.start.localeCompare(x.start):y.upd-x.upd));
h=`<h1>${V.arch?'القوائم المؤرشفة':'قوائمي'}</h1><div class="bar"><input id="lq" placeholder="بحث" value="${esc(V.q)}"><select id="lsort" style="width:auto"><option value="upd">آخر تعديل</option><option value="name" ${V.sort==='name'?'selected':''}>الاسم</option><option value="start" ${V.sort==='start'?'selected':''}>تاريخ البداية</option><option value="total" ${V.sort==='total'?'selected':''}>المجموع</option></select></div>
${ls.length?ls.map(listCard).join(''):`<div class="empty">${V.arch?'لا توجد قوائم مؤرشفة':'لا توجد قوائم.'}</div>`}
<div class="btns">${V.arch?'':'<button class="btn" data-act="addList">قائمة جديدة</button>'}<button class="btn sec" data-act="toggleArch">${V.arch?'العودة للقوائم':'المؤرشفة'}</button></div>`}
else{const s=S.settings;h=`<h1>الإعدادات</h1>${accountCard()}${backupCard()}<div class="card"><label style="margin-top:0">المظهر</label><select id="theme"><option value="auto">حسب الجهاز</option><option value="light" ${s.theme==='light'?'selected':''}>فاتح</option><option value="dark" ${s.theme==='dark'?'selected':''}>داكن</option></select>
<label>العملة الافتراضية</label><select id="dcur">${Object.keys(CUR).map(c=>`<option ${s.cur===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="card mute">الأرقام تظهر بالإنجليزية دائمًا.</div>`}
a.innerHTML=pill()+h}

function sheet(h){V.sheet=h;let b=document.querySelector('.sheetbg');if(!b){b=document.createElement('div');b.className='sheetbg';document.body.appendChild(b)}b.innerHTML=`<div class="sheet">${h}</div>`;b.onclick=e=>{if(e.target===b)closeSheet()}}
function closeSheet(){const b=document.querySelector('.sheetbg');if(b)b.remove()}
function confirmBox(msg,fn){sheet(`<p>${msg}</p><div class="btns"><button class="btn dng grow" id="yes">تأكيد الحذف</button><button class="btn sec grow" data-act="close">إلغاء</button></div>`);$('#yes').onclick=()=>{closeSheet();fn()}}

let pick={color:COLORS[0],icon:ICONS[0]};
function listForm(l){pick={color:l?l.color:COLORS[0],icon:l?l.icon:ICONS[0]};
sheet(`<h1>${l?'تعديل القائمة':'قائمة جديدة'}</h1><label style="margin-top:0">الاسم</label><input id="ln" maxlength="60" value="${esc(l?.name)}"><label>الوصف (اختياري)</label><input id="ld" maxlength="200" value="${esc(l?.desc)}">
<label>الأيقونة</label><div class="sw" id="sic">${ICONS.map(i=>`<button data-pi="${i}" class="${i===pick.icon?'on':''}">${i}</button>`).join('')}</div>
<label>اللون</label><div class="sw" id="sco">${COLORS.map(c=>`<button data-pc="${c}" style="background:${c}" class="${c===pick.color?'on':''}"></button>`).join('')}</div>
<div class="two"><div><label>تاريخ البداية</label><input type="date" id="ls" value="${l?.start||today()}"></div><div><label>تاريخ النهاية (اختياري)</label><input type="date" id="le" value="${l?.end||''}"></div></div>
<div class="btns"><button class="btn grow" id="sv">حفظ</button><button class="btn sec grow" data-act="close">إلغاء</button></div>`);
$('#sic').onclick=e=>{const b=e.target.closest('[data-pi]');if(b){pick.icon=b.dataset.pi;[...$('#sic').children].forEach(x=>x.classList.toggle('on',x===b))}};
$('#sco').onclick=e=>{const b=e.target.closest('[data-pc]');if(b){pick.color=b.dataset.pc;[...$('#sco').children].forEach(x=>x.classList.toggle('on',x===b))}};
$('#sv').onclick=()=>{const name=$('#ln').value.trim();if(!name)return toast('اكتب اسم القائمة');const st=$('#ls').value||today(),en=$('#le').value;if(en&&en<st)return toast('تاريخ النهاية قبل البداية');
const o={name,desc:$('#ld').value.trim(),icon:pick.icon,color:pick.color,start:st,end:en,upd:now()};
if(l)Object.assign(l,o);else S.lists.push(Object.assign({id:uid(),created:now(),pin:false,arch:false},o));save();closeSheet();render();toast('تم الحفظ')}}

function expForm(e,lid){if(!S.lists.length){toast('أنشئ قائمة أولًا');V.tab='lists';V.list=null;render();return listForm()}
const act=S.lists.filter(l=>!l.arch||l.id===e?.list);const sel=e?.list||lid||V.list||act[0]?.id;const cur=e?.cur||S.settings.cur;
sheet(`<h1>${e?'تعديل المصروف':'مصروف جديد'}</h1><label style="margin-top:0">القائمة</label><select id="el">${act.map(l=>`<option value="${l.id}" ${l.id===sel?'selected':''}>${l.icon} ${esc(l.name)}</option>`).join('')}</select>
<label>اسم المصروف</label><input id="en" maxlength="80" value="${esc(e?.name)}">
<div class="two"><div><label>المبلغ</label><input id="ea" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="0" value="${e?toInput(e.amt,e.cur):''}"></div><div><label>العملة</label><select id="ec">${Object.keys(CUR).map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join('')}</select></div></div>
<div class="two"><div><label>التاريخ</label><input type="date" id="ed" value="${e?.date||today()}"></div><div><label>الوقت (اختياري)</label><input type="time" id="et" value="${e?.time||''}"></div></div>
<label>التصنيف</label><input id="ek" list="cats" maxlength="40" value="${esc(e?.cat)}"><datalist id="cats">${CATS.map(c=>`<option value="${c}">`).join('')}</datalist>
<label>الوصف</label><input id="eds" maxlength="200" value="${esc(e?.desc)}"><label>ملاحظات</label><textarea id="eno" rows="2" maxlength="500">${esc(e?.note)}</textarea>
<div class="btns"><button class="btn grow" id="sv">حفظ</button><button class="btn sec grow" data-act="close">إلغاء</button></div>`);
const ai=$('#ea');ai.oninput=()=>{let v=norm(ai.value).replace(/[^0-9.]/g,'');const p=v.split('.');ai.value=p.length>1?p[0]+'.'+p.slice(1).join(''):v};
$('#sv').onclick=()=>{const name=$('#en').value.trim(),c=$('#ec').value,m=toMinor($('#ea').value,c);if(!name)return toast('اكتب اسم المصروف');if(m===null||m<=0)return toast('أدخل مبلغًا صحيحًا');if(!Number.isSafeInteger(m))return toast('المبلغ كبير جدًا');
const o={list:$('#el').value,name,amt:m,cur:c,date:$('#ed').value||today(),time:$('#et').value,cat:$('#ek').value.trim(),desc:$('#eds').value.trim(),note:$('#eno').value.trim(),upd:now()};
if(e)Object.assign(e,o);else S.expenses.push(Object.assign({id:uid(),created:now()},o));const l=getList(o.list);if(l)l.upd=now();save();closeSheet();render();toast('تم الحفظ')}}

const A={
addList:()=>listForm(),addExp:()=>expForm(null,V.list),close:closeSheet,
open:t=>{V.list=t.dataset.id;V.eq='';window.scrollTo(0,0);render()},back:()=>{V.list=null;V.tab='lists';render()},
toggleArch:()=>{V.arch=!V.arch;render()},
expMenu:t=>{const e=S.expenses.find(x=>x.id===t.dataset.id);sheet(`<h1>${esc(e.name)}</h1><div class="big"><span class="num">${fmt(e.amt,e.cur)}</span></div><p class="mute"><span class="num">${fd(e.date)}</span>${e.cat?' · '+esc(e.cat):''}</p>${e.desc?`<p>${esc(e.desc)}</p>`:''}${e.note?`<p class="mute">${esc(e.note)}</p>`:''}
<div class="btns"><button class="btn grow" data-act="expEdit" data-id="${e.id}">تعديل</button><button class="btn sec grow" data-act="expCopy" data-id="${e.id}">نسخ</button><button class="btn dng grow" data-act="expDel" data-id="${e.id}">حذف</button></div>`)},
expEdit:t=>expForm(S.expenses.find(x=>x.id===t.dataset.id)),
expCopy:t=>{const e=S.expenses.find(x=>x.id===t.dataset.id);S.expenses.push({...e,id:uid(),created:now(),upd:now()});save();closeSheet();render();toast('تم النسخ')},
expDel:t=>{const id=t.dataset.id;confirmBox('حذف هذا المصروف نهائيًا؟',()=>{S.expenses=S.expenses.filter(x=>x.id!==id);save();render();toast('تم الحذف')})},

const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};

function toB32(u){let b=0,v=0,o='';for(const x of u){v=((v<<8)|x)&0xffff;b+=8;while(b>=5){o+=B32[(v>>>(b-5))&31];b-=5}}if(b)o+=B32[(v<<(5-b))&31];return o}
function fromB32(s){s=s.toUpperCase().replace(/[^A-Z2-7]/g,'');let b=0,v=0;const o=[];for(const c of s){v=((v<<5)|B32.indexOf(c))&0xffff;b+=5;if(b>=8){o.push((v>>>(b-8))&255);b-=8}}return new Uint8Array(o)}
async function kdf(pw,salt,kind){pw=pw.normalize('NFKC');
if(kind==='argon2id'){const h=await import('https://cdn.jsdelivr.net/npm/hash-wasm@4.11.0/+esm');return h.argon2id({password:pw,salt,parallelism:1,iterations:3,memorySize:65536,hashLength:32,outputType:'binary'})}
const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},k,256))}
const aes=(raw,ext)=>crypto.subtle.importKey('raw',raw,'AES-GCM',!!ext,['encrypt','decrypt']);
async function seal(key,bytes,aad){const iv=rnd(12);const c=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode(aad)},key,bytes);return b64(iv)+'.'+b64(c)}
async function open(key,str,aad){const[i,c]=str.split('.');return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(i),additionalData:te.encode(aad)},key,unb64(c)))}

async function rawFromRk(txt){const rk=fromB32(txt);if(rk.length!==32||!KR.wrapRec)throw 0;return open(await aes(rk),KR.wrapRec,aadK('rec'))}
async function wrapPwFor(mk,pw){let kind='argon2id',salt=rnd(16),k;try{k=await kdf(pw,salt,kind)}catch(e){kind='pbkdf2';k=await kdf(pw,salt,kind)}

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('myexp_keys',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kget=async id=>{const d=await idb();return new Promise(res=>{const q=d.transaction('k').objectStore('k').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})};

BK={L,E};const nl=L.filter(l=>!S.lists.some(x=>x.id===l.id)).length,ne=E.filter(e=>!S.expenses.some(x=>x.id===e.id)).length;
sheet(`<h1>محتوى النسخة</h1><div class="card"><div><span class="num">${L.length}</span> قائمة (<span class="num">${nl}</span> جديدة)</div><div><span class="num">${E.length}</span> مصروف (<span class="num">${ne}</span> جديد)</div>${d.created?`<div class="mute">أُنشئت في <span class="num">${fd(new Date(d.created).toISOString().slice(0,10))}</span></div>`:''}</div><p class="mute">لن يُحذف أي شيء من بياناتك الحالية.</p><div class="btns" style="flex-direction:column"><button class="btn" data-act="bkGo" data-u="0">استيراد الجديد فقط</button><button class="btn sec" data-act="bkGo" data-u="1">استيراد الجديد وتحديث الموجود</button><button class="btn sec" data-act="close">إلغاء</button></div>`)}),
bkGo:t=>{if(!BK)return;const u=t.dataset.u==='1';let add=0,upd=0;
BK.L.forEach(l=>{const i=S.lists.findIndex(x=>x.id===l.id);if(i<0){S.lists.push(l);add++}else if(u){Object.assign(S.lists[i],l);upd++}});
const have=new Set(S.lists.map(l=>l.id));
BK.E.forEach(e=>{if(!have.has(e.list))return;const i=S.expenses.findIndex(x=>x.id===e.id);if(i<0){S.expenses.push(e);add++}else if(u){Object.assign(S.expenses[i],e);upd++}});
BK=null;save();closeSheet();render();toast('أُضيف '+add+(upd?' وحُدّث '+upd:'')+' سجل')}
});
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){V.tab=n.dataset.nav;V.list=null;V.arch=false;render();return}const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t)});
document.addEventListener('input',e=>{const i=e.target.id;if(i==='lq'){V.q=e.target.value;const p=e.target.selectionStart;render();const x=$('#lq');x.focus();x.setSelectionRange(p,p)}if(i==='eq'){V.eq=e.target.value;const p=e.target.selectionStart;render();const x=$('#eq');x.focus();x.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='lsort'){V.sort=e.target.value;render()}if(i==='esort'){V.esort=e.target.value;render()}if(i==='theme'){S.settings.theme=e.target.value;save();applyTheme()}if(i==='dcur'){S.settings.cur=e.target.value;save()}});
loadS();render();fbInit().catch(e=>{FBERR='تعذر تحميل Firebase. تأكد من الاتصال ومن استضافة الملف على موقعك (وليس داخل معاينة).';AUTHREADY=true;render()});
</script>
